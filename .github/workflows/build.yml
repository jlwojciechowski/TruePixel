name: Build TruePixel

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore "True Pixel.csproj"

      - name: Build
        run: dotnet build "True Pixel.csproj" -c Release --no-restore

      - name: Publish
        run: dotnet publish "True Pixel.csproj" -c Release -r win-x64 --self-contained false -o publish

      - name: Upload TruePixel
        uses: actions/upload-artifact@v4
        with:
          name: TruePixel
          path: publish/
